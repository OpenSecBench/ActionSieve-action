# Azure Pipelines template for ActionSieve
#
# Usage in your pipeline:
#   - template: actionsieve.yml
#     parameters:
#       patterns: path/to/patterns

parameters:
  - name: path
    type: string
    default: "."
  - name: format
    type: string
    default: json
    values: [json, yaml, sarif, markdown]
  - name: platform
    type: string
    default: ""
  - name: profile
    type: string
    default: ""
  - name: patterns
    type: string
    default: ""
  - name: failOn
    type: string
    default: ""
  - name: pythonVersion
    type: string
    default: "3.12"
  - name: extraArgs
    type: string
    default: ""

steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}
    displayName: Set up Python

  - script: pip install --quiet actionsieve
    displayName: Install actionsieve

  - script: |
      args=("scan" "--format" "$ACTIONSIEVE_FORMAT")

      if [ -n "$ACTIONSIEVE_PLATFORM" ]; then
        args+=("--platform" "$ACTIONSIEVE_PLATFORM")
      fi
      if [ -n "$ACTIONSIEVE_PROFILE" ]; then
        args+=("--profile" "$ACTIONSIEVE_PROFILE")
      fi
      if [ -n "$ACTIONSIEVE_PATTERNS" ]; then
        args+=("--patterns" "$ACTIONSIEVE_PATTERNS")
      fi
      if [ -n "$ACTIONSIEVE_FAIL_ON" ]; then
        args+=("--fail-on" "$ACTIONSIEVE_FAIL_ON")
      fi

      if [ "$ACTIONSIEVE_FORMAT" = "sarif" ]; then
        args+=("--output" "$(Build.ArtifactStagingDirectory)/actionsieve.sarif")
      elif [ "$ACTIONSIEVE_FORMAT" = "json" ]; then
        args+=("--output" "$(Build.ArtifactStagingDirectory)/actionsieve.json")
      fi

      if [ -n "$ACTIONSIEVE_EXTRA_ARGS" ]; then
        read -ra extra <<< "$ACTIONSIEVE_EXTRA_ARGS"
        args+=("${extra[@]}")
      fi

      actionsieve "${args[@]}" "$ACTIONSIEVE_PATH"
    displayName: Run actionsieve scan
    continueOnError: true
    env:
      ACTIONSIEVE_PATH: ${{ parameters.path }}
      ACTIONSIEVE_FORMAT: ${{ parameters.format }}
      ACTIONSIEVE_PLATFORM: ${{ parameters.platform }}
      ACTIONSIEVE_PROFILE: ${{ parameters.profile }}
      ACTIONSIEVE_PATTERNS: ${{ parameters.patterns }}
      ACTIONSIEVE_FAIL_ON: ${{ parameters.failOn }}
      ACTIONSIEVE_EXTRA_ARGS: ${{ parameters.extraArgs }}

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      pathToPublish: $(Build.ArtifactStagingDirectory)
      artifactName: actionsieve-results
    displayName: Publish results
